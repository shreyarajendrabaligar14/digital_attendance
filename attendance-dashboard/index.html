<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Recognition Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 1rem;
        }
        /* Custom scrollbar for tables */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const UploadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        const UsersIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const XIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-red-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;

        const PieChart = ({ present, absent }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                if (chartRef.current && (present > 0 || absent > 0)) {
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Present', 'Absent'],
                            datasets: [{
                                data: [present, absent],
                                backgroundColor: ['#10b981', '#f43f5e'],
                                hoverBackgroundColor: ['#059669', '#e11d48'],
                                borderWidth: 0,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '70%',
                            plugins: {
                                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.label || '';
                                            if (label) label += ': ';
                                            if (context.parsed !== null) {
                                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                                const percentage = Math.round((context.parsed / total) * 100);
                                                label += context.parsed + ' (' + Math.round(percentage) + '%)';
                                            }
                                            return label;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [present, absent]);

            if (present === 0 && absent === 0) {
                return <div className="flex items-center justify-center h-full text-gray-400">No data available</div>;
            }

            return <div className="h-64 relative"><canvas ref={chartRef}></canvas></div>;
        };

        const Dashboard = () => {
            const [loading, setLoading] = useState(false);
            const [selectedImage, setSelectedImage] = useState(null);
            const [imagePreview, setImagePreview] = useState(null);
            const [error, setError] = useState(null);
            const fileInputRef = useRef(null);

            const [data, setData] = useState({
                total_students: 0,
                present_count: 0,
                absent_count: 0,
                present_students: [],
                absent_students: []
            });

            const attendancePercentage = data.total_students > 0 
                ? Math.round((data.present_count / data.total_students) * 100) 
                : 0;

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setSelectedImage(file);
                    setError(null);
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImagePreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleUpload = async () => {
                if (!selectedImage) {
                    alert('Please select an image first.');
                    return;
                }

                setLoading(true);
                setError(null);
                const formData = new FormData();
                formData.append('file', selectedImage);

                try {
                    const response = await axios.post('http://127.0.0.1:8000/upload', formData, {
                        headers: { 'Content-Type': 'multipart/form-data' }
                    });
                    
                    if (response.data) {
                        setData({
                            total_students: response.data.total_students || 0,
                            present_count: response.data.present_count || 0,
                            absent_count: response.data.absent_count || 0,
                            present_students: response.data.present_students || [],
                            absent_students: response.data.absent_students || []
                        });
                    }
                } catch (err) {
                    console.error('Error uploading image:', err);
                    setError('Failed to process image. Make sure the backend API is running.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen p-6 md:p-8">
                    {/* Header */}
                    <div className="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center">
                        <div>
                            <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">
                                AI Face Recognition Attendance System
                            </h1>
                            <p className="text-gray-500 mt-2 text-sm">Automated classroom attendance using computer vision</p>
                        </div>
                        
                        <div className="mt-4 md:mt-0 flex items-center gap-4">
                            <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleImageChange} 
                                accept="image/*" 
                                className="hidden" 
                            />
                            
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-lg font-medium transition-colors shadow-sm text-sm flex items-center"
                            >
                                Choose Image
                            </button>
                            
                            <button 
                                onClick={handleUpload}
                                disabled={!selectedImage || loading}
                                className={`px-5 py-2 rounded-lg font-medium transition-all shadow-sm text-sm flex items-center text-white
                                    ${(!selectedImage || loading) ? 'bg-indigo-300 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200 shadow-md transform hover:-translate-y-0.5'}`}
                            >
                                {loading && (
                                    <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                )}
                                {!loading && <UploadIcon />}
                                Process Image
                            </button>
                        </div>
                    </div>

                    {error && (
                        <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg flex items-center text-red-700">
                            <AlertIcon />
                            <span>{error}</span>
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        {/* Stats Cards & Image Preview - Left Column (lg:col-span-3) */}
                        <div className="lg:col-span-3 space-y-6">
                            {/* Stats row */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="glass-card p-6 flex items-center justify-between border-l-4 border-l-blue-500">
                                    <div>
                                        <p className="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Students</p>
                                        <p className="text-3xl font-bold text-gray-800 mt-1">{data.total_students}</p>
                                    </div>
                                    <div className="bg-blue-50 p-3 rounded-xl"><UsersIcon /></div>
                                </div>
                                
                                <div className="glass-card p-6 flex items-center justify-between border-l-4 border-l-emerald-500">
                                    <div>
                                        <p className="text-sm font-medium text-gray-500 uppercase tracking-wider">Present</p>
                                        <p className="text-3xl font-bold text-emerald-600 mt-1">{data.present_count}</p>
                                    </div>
                                    <div className="bg-emerald-50 p-3 rounded-xl"><CheckIcon /></div>
                                </div>
                                
                                <div className="glass-card p-6 flex items-center justify-between border-l-4 border-l-rose-500">
                                    <div>
                                        <p className="text-sm font-medium text-gray-500 uppercase tracking-wider">Absent</p>
                                        <p className="text-3xl font-bold text-rose-600 mt-1">{data.absent_count}</p>
                                    </div>
                                    <div className="bg-rose-50 p-3 rounded-xl"><XIcon /></div>
                                </div>
                            </div>

                            {/* Tables Row */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Present Students Table */}
                                <div className="glass-card flex flex-col overflow-hidden h-96">
                                    <div className="bg-emerald-50/50 border-b border-emerald-100 p-4 flex justify-between items-center">
                                        <h3 className="font-semibold text-emerald-800 flex items-center">
                                            <span className="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
                                            Present Students
                                        </h3>
                                        <span className="text-xs bg-emerald-100 text-emerald-700 py-1 px-2 rounded-full font-medium">
                                            {data.present_students.length}
                                        </span>
                                    </div>
                                    <div className="overflow-y-auto custom-scrollbar flex-grow p-0">
                                        <table className="min-w-full text-left text-sm">
                                            <thead className="bg-gray-50/80 text-gray-600 sticky top-0 backdrop-blur-sm">
                                                <tr>
                                                    <th className="px-4 py-3 font-medium">Name</th>
                                                    <th className="px-4 py-3 font-medium">Roll No</th>
                                                    <th className="px-4 py-3 font-medium text-right">Confidence %</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {data.present_students.length > 0 ? (
                                                    data.present_students.map((student, idx) => (
                                                        <tr key={idx} className="hover:bg-emerald-50/30 transition-colors">
                                                            <td className="px-4 py-3 font-medium text-gray-800">{student.name || 'Unknown'}</td>
                                                            <td className="px-4 py-3 text-gray-500">{student.roll_no || 'N/A'}</td>
                                                            <td className="px-4 py-3 text-right">
                                                                <span className="inline-flex items-center justify-center px-2 py-1 rounded text-xs font-medium bg-emerald-100 text-emerald-700">
                                                                    {student.confidence ? (student.confidence * 100).toFixed(1) + '%' : 'N/A'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="3" className="px-4 py-8 text-center text-gray-400">No present students data</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Absent Students Table */}
                                <div className="glass-card flex flex-col overflow-hidden h-96">
                                    <div className="bg-rose-50/50 border-b border-rose-100 p-4 flex justify-between items-center">
                                        <h3 className="font-semibold text-rose-800 flex items-center">
                                            <span className="w-2 h-2 rounded-full bg-rose-500 mr-2"></span>
                                            Absent Students
                                        </h3>
                                        <span className="text-xs bg-rose-100 text-rose-700 py-1 px-2 rounded-full font-medium">
                                            {data.absent_students.length}
                                        </span>
                                    </div>
                                    <div className="overflow-y-auto custom-scrollbar flex-grow p-0">
                                        <table className="min-w-full text-left text-sm">
                                            <thead className="bg-gray-50/80 text-gray-600 sticky top-0 backdrop-blur-sm">
                                                <tr>
                                                    <th className="px-4 py-3 font-medium">Name</th>
                                                    <th className="px-4 py-3 font-medium">Roll No</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {data.absent_students.length > 0 ? (
                                                    data.absent_students.map((student, idx) => (
                                                        <tr key={idx} className="hover:bg-rose-50/30 transition-colors">
                                                            <td className="px-4 py-3 font-medium text-gray-800">{student.name || 'Unknown'}</td>
                                                            <td className="px-4 py-3 text-gray-500">{student.roll_no || 'N/A'}</td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="2" className="px-4 py-8 text-center text-gray-400">No absent students data</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Chart & Image (lg:col-span-1) */}
                        <div className="lg:col-span-1 space-y-6">
                            <div className="glass-card p-6 flex flex-col items-center justify-center">
                                <h3 className="font-semibold text-gray-800 mb-4 self-start">Attendance Rate</h3>
                                <div className="w-full bg-gray-200 rounded-full h-4 mb-2 overflow-hidden">
                                    <div 
                                        className="bg-indigo-600 h-4 rounded-full transition-all duration-1000" 
                                        style={{ width: `${attendancePercentage}%` }}
                                    ></div>
                                </div>
                                <div className="text-center font-bold text-2xl text-indigo-700">
                                    {attendancePercentage}%
                                </div>
                            </div>

                            <div className="glass-card p-6 h-[20rem] flex flex-col">
                                <h3 className="font-semibold text-gray-800 mb-4">Overview</h3>
                                <div className="flex-grow flex items-center justify-center">
                                    <PieChart present={data.present_count} absent={data.absent_count} />
                                </div>
                            </div>

                            <div className="glass-card p-4 h-64 flex flex-col">
                                <h3 className="font-semibold text-gray-800 mb-3 text-sm">Classroom Image</h3>
                                <div className="flex-grow rounded-lg border-2 border-dashed border-gray-200 bg-gray-50 flex items-center justify-center overflow-hidden relative">
                                    {loading ? (
                                        <div className="absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-10 transition-opacity">
                                            <div className="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
                                            <p className="text-sm font-medium text-indigo-800 animate-pulse">Running Face Recognition...</p>
                                        </div>
                                    ) : null}
                                    
                                    {imagePreview ? (
                                        <img src={imagePreview} alt="Classroom" className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="text-center p-4">
                                            <svg className="mx-auto h-12 w-12 text-gray-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                                            </svg>
                                            <p className="text-sm text-gray-500">No image selected</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
